let lang = "es";
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const url = id => `https://fborrasumh.github.io/${id}/`;
const isBuilt = id => BUILT.includes(id) || !!COMP[id];

function legend(L){
  return [2,3,4,5].map(n => `<span style="--c:var(${SES_COLOR[n]})"><i class="sw"></i>${esc(L.legSes)} ${n}</span>`).join("") +
    `<span><i class="sw opt"></i>${esc(L.legOpt)}</span><span><i class="sw comp"></i>${esc(L.legComp)}</span>` +
    (APPS.some(a => !isBuilt(a.id)) ? `<span style="color:var(--muted)"><span class="soon-dot" style="margin:0;opacity:1;background:var(--muted)"></span>${esc(L.soon)}</span>` : "");
}
function link(id, cls, inner, title){
  const t = title ? ` title="${esc(title)}"` : "";
  return isBuilt(id)
    ? `<a class="${cls}" href="${url(id)}" target="_blank" rel="noopener"${t}>${inner}</a>`
    : `<span class="${cls}"${t}>${inner}</span>`;
}
function mini(id, L){
  const a = APPS.find(x => x.id === id);
  const soon = a && !isBuilt(id) ? ` · ${L.soon}` : "";
  if (!a) return link(id, "mini comp", esc(COMP[id]), L.short[id]);
  if (a.ses === 0) return link(id, "mini opt", esc(a.name), L.short[id] + soon);
  return `<span style="--c:var(${SES_COLOR[a.ses]})">${link(id, "mini ses", `S${a.ses} · ${esc(a.name)}`, L.short[id] + soon)}</span>`;
}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = L[el.dataset.i18nHtml]; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === lang));
  document.getElementById("legend1").innerHTML = legend(L);
  document.getElementById("legend2").innerHTML = legend(L);

  let rows = `<thead><tr><th>${esc(L.thNum)}</th><th>${esc(L.thProc)}</th><th>${esc(L.thTask)}</th><th>${esc(L.thCode)}</th><th>${esc(L.thAI)}</th><th>${esc(L.thSign)}</th><th>${esc(L.thPot)}</th><th>${esc(L.thApps)}</th></tr></thead><tbody>`;
  let g = -1;
  PROCS.forEach((p, i) => {
    const [grp, pot, apps] = p, P = L.procs[i];
    if (grp !== g) { g = grp; rows += `<tr class="grp"><td colspan="8">${esc(L.groups[g])}</td></tr>`; }
    rows += `<tr><td class="num">${i+1}</td><td class="proc">${esc(P[0])}</td><td>${esc(P[1])}</td><td>${esc(P[2])}</td><td>${esc(P[3])}</td><td>${esc(P[4])}</td>
      <td><span class="pot ${pot}">${esc(pot === "h" ? L.potHigh : L.potMed)}</span></td><td>${apps.map(id => mini(id, L)).join("")}</td></tr>`;
  });
  document.getElementById("board").innerHTML = rows + "</tbody>";

  document.getElementById("phases").innerHTML = PHASES.map((ids, i) => `<div class="phase">
      <div class="phase-h"><span class="phase-n">${i+1}</span><span class="phase-t">${esc(L.phases[i])}</span></div>
      ${ids.map(id => {
        const a = APPS.find(x => x.id === id);
        const dot = a && !isBuilt(id) ? `<span class="soon-dot" title="${esc(L.soon)}"></span>` : "";
        if (!a) return link(id, "chip comp", `<span class="tag">${esc(L.tagComp)}</span><b>${esc(COMP[id])}</b>${esc(L.short[id])}`);
        if (a.ses === 0) return link(id, "chip opt", `<span class="tag">${esc(L.tagOpt)}</span><b>${esc(a.name)}${dot}</b>${esc(L.short[id])}`, L.soon);
        return `<span style="--c:var(${SES_COLOR[a.ses]})">${link(id, "chip ses", `<span class="tag">S${a.ses}</span><b>${esc(a.name)}${dot}</b>${esc(L.short[id])}`, isBuilt(id) ? "" : L.soon)}</span>`;
      }).join("")}
    </div>`).join("");

  const card = a => {
    const A = L.apps[a.id];
    const btn = isBuilt(a.id)
      ? `<a class="btn" href="${url(a.id)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> ${esc(L.open)}</a>`
      : `<span class="soon"><i class="ti ti-hammer"></i> ${esc(L.soon)}</span>`;
    return `<article class="card${a.ses === 0 ? " optcard" : ""}">
      <div class="card-h"><div class="icon-box"><i class="ti ${a.icon}"></i></div><h4>${a.name}</h4></div>
      <p>${esc(A.what)}</p>
      <div class="chk"><b>${esc(L.checks)}</b>${esc(A.chk)}</div>
      <div class="foot"><span class="procs">${esc(L.procLbl)}: ${a.procs.join(", ")}</span>${btn}</div>
    </article>`;
  };
  document.getElementById("groups").innerHTML = [2,3,4,5].map(n =>
    `<div class="sgroup" style="--c:var(${SES_COLOR[n]})"><h3>${esc(L.session)} ${n} · ${esc(L.sessions[n-1].t)}</h3><div class="grid">${APPS.filter(a => a.ses === n).map(card).join("")}</div></div>`
  ).join("") + `<div class="sgroup" style="--c:var(--opt)"><h3>${esc(L.optional)}</h3><div class="grid">${APPS.filter(a => a.ses === 0).map(card).join("")}</div></div>`;

  document.getElementById("sessions").innerHTML =
    `<div class="srow head"><div></div><div>${esc(L.thSes)}</div><div class="hide-sm">${esc(L.thOut)}</div></div>` +
    L.sessions.map((s,i) => `<div class="srow" style="--c:var(${SES_COLOR[i+1]})">
      <div class="snum">${i+1}</div>
      <div><div class="stit">${esc(s.t)}</div><div class="sapp">${esc(s.a)}</div>${i === 0 ? `<a class="slink" href="https://fborrasumh.github.io/investigadoria/sesion1/" target="_blank" rel="noopener"><i class="ti ti-presentation"></i> ${esc(L.slides)}</a>` : ""}</div>
      <div class="hide-sm">${esc(s.o)}</div>
    </div>`).join("");

  const list = (id, arr) => { document.getElementById(id).innerHTML = arr.map(x => `<li>${esc(x)}</li>`).join(""); };
  list("chatL", L.chat); list("apiL", L.api); list("keySteps", L.keySteps); list("keyChoose", L.keyChoose); list("priv", L.priv); list("eth", L.eth);
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("calidaduniversitaria-lang", l); } catch(e) {}
  render();
}

document.getElementById("langs").innerHTML = LANGS.map(l => `<button data-l="${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
try {
  const q = new URLSearchParams(location.search).get("lang");
  const saved = q || localStorage.getItem("calidaduniversitaria-lang");
  lang = LANGS.includes(saved) ? saved : "es";
} catch(e) {}
render();
</script>
